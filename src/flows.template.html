       1. login with a berkeley.edu email (+ optional invite)
       2. "Make your locker :)" — about you + theme picker + sprite maker
       3. decorate — photo bank / sticker bank / objects, drag, resize, rotate, flip
       4. go live → hallway, daily quiz pops up
       5. past quizzes grid, notes poking out of your locker (stack, single, all)

const TITLES = { polaroid_sunset: 'sunset polaroid', polaroid_cat: 'cat photo', polaroid_beach: 'beach day', polaroid_ramen: 'ramen night', polaroid_mountains: 'mountain hike', polaroid_friends: 'friends',
  sticker_star: 'gold star', sticker_heart: 'heart sticker', sticker_flower: 'flower sticker', sticker_bear: 'bear sticker',
  plant: 'plant', books: 'books', boba_milk: 'milk tea', boba_matcha: 'matcha latte', headphones: 'headphones', bunny: 'bunny plush', onigiri: 'onigiri', camera: 'camera',
  volleyball: 'volleyball', sketchbook: 'sketchbook', mirror: 'mirror', whiteboard: 'whiteboard', schedule: 'schedule', sticky: 'sticky note', bunting: 'bunting' };
const PHOTO_BANK = ['polaroid_sunset', 'polaroid_friends', 'polaroid_cat', 'polaroid_beach', 'polaroid_ramen', 'polaroid_mountains'];
const STICKER_BANK = ['sticker_star', 'sticker_heart', 'sticker_flower', 'sticker_bear'];
const OBJECTS = ['plant', 'books', 'boba_milk', 'boba_matcha', 'headphones', 'bunny', 'onigiri', 'camera', 'volleyball', 'sketchbook', 'mirror', 'whiteboard', 'schedule', 'sticky', 'bunting'];
const PHOTO_SIZES = [[20, 24, 16, 15], [28, 33, 24, 22], [36, 42, 32, 29]]; // frame w,h + photo w,h
const OPEN = { x0: 7, y0: 7, x1: 182, y1: 158 };
let items = null, uid = 0;
const customPhotos = [], customStickers = [];

function startItems() {
  // start from whatever is in your locker right now (the starter bunting / sticky note / plant)
  items = ME.items.map(([k, x, y, t, d]) => {
    const base = k.startsWith('ux_') ? (bakedFrom[k] || null) : null;
    if (base) return Object.assign({}, base, { id: ++uid });
    const [w, h] = sz(k);
    return { id: ++uid, kind: k.startsWith('polaroid') ? 'photo' : k.startsWith('sticker') ? 'sticker' : 'object', base: k, scale: 1, rot: 0, flip: false, cx: x + w / 2, cy: y + h / 2, title: t, desc: d };

}
const bakedFrom = {};

async function srcCanvas(it) {
  // the item's un-transformed pixels
  if (it.upload) {
    if (it.kind === 'photo') return framePhoto(it.upload, PHOTO_SIZES[it.size || 0]);
    return it.upload; // sticker canvas
  }
  const im = await asset(it.base); const [w, h] = sz(it.base);
  const [c, x] = canvas(w, h); x.drawImage(im, 0, 0); return c;
}

  const src = await srcCanvas(it);
  const s = it.upload && it.kind === 'photo' ? 1 : it.scale;
  const w = src.width * s, h = src.height * s, r = it.rot * Math.PI / 180;
  const W = Math.ceil(Math.abs(w * Math.cos(r)) + Math.abs(h * Math.sin(r))), H = Math.ceil(Math.abs(w * Math.sin(r)) + Math.abs(h * Math.cos(r)));

  x.drawImage(src, -w / 2, -h / 2, w, h);
  const k = 'ux_' + it.id + '_' + (++uid);
  A[k] = c.toDataURL(); SIZES[k] = [W, H]; it.key = k; it.W = W; it.H = H;
  bakedFrom[k] = Object.assign({}, it);
  return it;
}

// photo upload → pixel polaroid, drawn the same way as polaroid() in assets.py
function pixelate(image, pw, ph) {
  const iw = image.naturalWidth || image.width, ih = image.naturalHeight || image.height;
  const s = Math.max(pw / iw, ph / ih); const sw = pw / s, sh = ph / s;
  const [m, mx] = canvas(pw * 4, ph * 4); mx.imageSmoothingEnabled = true; mx.imageSmoothingQuality = 'high';
  mx.drawImage(image, (iw - sw) / 2, (ih - sh) / 2, sw, sh, 0, 0, pw * 4, ph * 4);
  const [c, x] = canvas(pw, ph); x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high'; x.drawImage(m, 0, 0, pw, ph);
  const d = x.getImageData(0, 0, pw, ph); for (let i = 0; i < d.data.length; i += 4) for (let j = 0; j < 3; j++) d.data[i + j] = Math.min(255, Math.round(d.data[i + j] / 20) * 20 + 6);
  x.putImageData(d, 0, 0); return c;
}
function framePhoto(image, [W, H, pw, ph]) {
  const [c, x] = canvas(W, H);
  const r = (x0, y0, x1, y1, col) => { x.fillStyle = col; x.fillRect(x0, y0, x1 - x0 + 1, y1 - y0 + 1); };
  r(0, 1, W - 1, H - 1, '#6e4a3c'); r(1, 2, W - 2, H - 2, '#fffaf0'); r(1, H - 2, W - 2, H - 2, '#f3e6cf'); r(W - 2, 2, W - 2, H - 2, '#f3e6cf');
  x.drawImage(pixelate(image, pw, ph), 2, 3); r(2, 3 + ph, W - 3, 3 + ph, '#e2cfae');
  const t0 = Math.round(W / 2) - 4; for (let i = 0; i < 8; i++) { r(t0 + i, 0, t0 + i, 2, '#f4b8c7'); if (i % 2) r(t0 + i, 1, t0 + i, 1, '#fbd9e1'); }
  return c;
}
function stickerize(image) {
  const iw = image.naturalWidth || image.width, ih = image.naturalHeight || image.height;
  const s = 18 / Math.max(iw, ih); const w = Math.max(4, Math.round(iw * s)), h = Math.max(4, Math.round(ih * s));
  const [m, mx] = canvas(w, h); mx.imageSmoothingEnabled = true; mx.imageSmoothingQuality = 'high'; mx.drawImage(image, 0, 0, w, h);
  const d = mx.getImageData(0, 0, w, h);
  const opaque = [...Array(w * h).keys()].every(i => d.data[i * 4 + 3] > 200);
  const inside = (px, py) => px >= 0 && py >= 0 && px < w && py < h && (opaque ? !((px === 0 || px === w - 1) && (py === 0 || py === h - 1)) : d.data[(py * w + px) * 4 + 3] > 128);
  const [c, x] = canvas(w + 3, h + 3);
  for (let py = -1; py <= h; py++) for (let px = -1; px <= w; px++) {
    let near = false; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (inside(px + dx, py + dy)) near = true;
    if (near) { x.fillStyle = 'rgba(0,0,0,.16)'; x.fillRect(px + 2, py + 2, 1, 1); }
  }
  for (let py = -1; py <= h; py++) for (let px = -1; px <= w; px++) {
    let near = false; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (inside(px + dx, py + dy)) near = true;
    if (near) { x.fillStyle = '#fff'; x.fillRect(px + 1, py + 1, 1, 1); }
  }
  for (let py = 0; py < h; py++) for (let px = 0; px < w; px++) if (inside(px, py)) {
    const i = (py * w + px) * 4; x.fillStyle = `rgb(${Math.round(d.data[i] / 24) * 24},${Math.round(d.data[i + 1] / 24) * 24},${Math.round(d.data[i + 2] / 24) * 24})`; x.fillRect(px + 1, py + 1, 1, 1);

}

  ['sun', 'ideal weekend: select all', 'farmers market, naps', '8 neighbors'],
  ['sat', 'your major in one emoji', '💻', '8 neighbors'],
  ['fri', 'boba order?', 'taro, 50%', '8 neighbors'],
  ['thu', 'north side or south side?', 'south side', '8 neighbors'],
];
let quizAnswer = null;
function openQuiz() {
  const L = el('div', { id: 'quizModal', className: 'fl' }, [el('div', { className: 'fl-dim' })]);
  L._esc = () => popLayer(L);
  const card = el('div', { className: 'card2' });
  L.append(card); pushLayer(L);
  let pick = null;
  const ask = () => {
    card.innerHTML = '';
    const opts = el('div', { className: 'qopts' });
    const other = el('input', { className: 'fin', placeholder: 'something else? write it here', maxLength: 60 });
    TODAY_Q.opts.forEach(o => {
      const b = el('button', { className: 'qopt', type: 'button', textContent: o }); b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', () => { pick = o; other.value = ''; opts.querySelectorAll('.qopt').forEach(x => x.setAttribute('aria-pressed', x === b)); submit.disabled = false; });
      opts.append(b);
    });
    other.addEventListener('input', () => { pick = other.value.trim() || null; opts.querySelectorAll('.qopt').forEach(x => x.setAttribute('aria-pressed', 'false')); submit.disabled = !pick; });
    opts.append(other);
    const submit = btn('submit', 'bigbtn', () => { quizAnswer = pick; done(); }); submit.disabled = true;
    card.append(el('h2', { textContent: 'daily quiz!' }),
      el('div', { className: 'qbox' }, [el('span', { className: 'qkind', textContent: TODAY_Q.kind }), document.createTextNode(TODAY_Q.q)]), opts,
      el('div', { className: 'qfoot' }, [btn('later', 'link', () => popLayer(L)), submit]));
  };
  const done = () => {
    card.innerHTML = '';
    const same = 40 + (quizAnswer.length * 7) % 90;
    card.append(el('h2', { textContent: 'daily quiz!' }), el('div', { className: 'qdone' }, [
      el('div', { className: 'big', textContent: 'locked in ✿' }),
      el('div', { className: 'stat', textContent: `you said: ${quizAnswer}` }),
      el('div', { className: 'sub', textContent: `${same} people said something similar so far. tomorrow at 7am your hallway refreshes with 8 of them.` }),
      el('div', { className: 'sub', textContent: 'today’s neighbors? you were matched on yesterday’s quiz — favorite study spot: Doe Library.' }),
      btn('see today’s neighbors →', 'bigbtn pink', () => { popLayer(L); sayHome(HOME_HELLO); })]));
  };
  if (quizAnswer) done(); else ask();
}
function openPastQuizzes() {
  const L = el('div', { id: 'pastModal', className: 'fl' }, [el('div', { className: 'fl-dim' })]);
  L._esc = () => popLayer(L);
  const g = el('div', { className: 'grid9' });
  const today = el('button', { className: 'qcard today', type: 'button' }, [el('span', { className: 'd', textContent: 'today' }), el('span', { className: 'q', textContent: TODAY_Q.q }),
    quizAnswer ? el('span', { className: 'a', textContent: quizAnswer }) : el('span', { className: 'a', textContent: 'answer it →' }), el('span', { className: 'm', textContent: 'matches tomorrow at 7am' })]);
  today.addEventListener('click', () => { popLayer(L); openQuiz(); });
  g.append(today);
  PAST_QS.forEach(([d, q, a, m], i) => { const c = el('div', { className: 'qcard' }, [el('span', { className: 'd', textContent: d }), el('span', { className: 'q', textContent: q }), el('span', { className: 'a', textContent: a }), el('span', { className: 'm', textContent: 'matched with ' + m })]); c.style.animationDelay = i * 30 + 'ms'; g.append(c); });
  L.append(el('div', { className: 'mtitle', textContent: 'past quizzes' }), g, el('div', { className: 'mclose' }, [btn('close', 'chip', L._esc)]));
  pushLayer(L);
}

/* ================================================================
   notes slipped into your locker
   ================================================================ */
const NOTES = [
  { from: RECEIVED.from, text: RECEIVED.text, when: RECEIVED.when, read: false },
  { from: PEOPLE.find(p => p.id === 'sofia'), text: 'your sprite is so cute omg. do you play stardew? i need a farm co-op partner for the weekend', when: 'this morning', read: false },
  { from: PEOPLE.find(p => p.id === 'kai'), text: 'fellow North Reading Room regular! i’m the one with the bird book by the window. come say hi, i’ll show you the hawk', when: '9:12 am', read: false },
  { from: PEOPLE.find(p => p.id === 'mei'), text: 'ok your locker made me smile. portrait swap? i take one of you on film, you draw one of me ✿', when: '8:40 am', read: false },
];
// a note is "viewed" once you unfold it (or open its DM). viewed notes leave your locker + the notes grid
// and live in your DMs only. every note is a DM thread from the start.
const unviewed = () => NOTES.filter(n => !n.read);
function unreadNotes() { return profile.live && unviewed().length > 0; }
function updateBadges() { const n = profile.live ? unviewed().length : 0; const b = $('#mailBadge'); b.hidden = !n; b.textContent = n; }
function markViewed(n) { n.read = true; updateBadges(); }
function backToHall() { renderGrid(); updateBadges(); }

function openNoteStack() {
  closeMail(); if (viewer) closeLocker();
  const list = unviewed();
  if (!list.length) { openLocker(ME); return; }
  const L = el('div', { id: 'stackLayer', className: 'fl' }, [el('div', { className: 'fl-dim' })]);
  L._esc = () => popLayer(L);
  L.querySelector('.fl-dim').addEventListener('click', L._esc);
  const doorEl = el('button', { id: 'stackDoor', className: 'abs', type: 'button' }, [img('doorfront_' + ME.skin, 176, 152)]);
  doorEl.setAttribute('aria-label', 'Unfold the top note');
  // a little stack of unviewed notes poking out of the top vent
  list.forEach((n, i) => {
    const s = el('div', { className: 'slip' + (i === 0 ? ' top' : '') }, [el('b', { textContent: n.from.name.split(' ')[0] })]);
    s.style.left = 60 + i * 9 + 'px'; s.style.top = 6 - i * 3 + 'px'; s.style.transform = `rotate(${[-8, 5, -3, 9][i % 4]}deg)`; s.style.zIndex = list.length - i;
    doorEl.append(s);
  });
  doorEl.addEventListener('click', () => { popLayer(L); openOneNote(list[0]); });
  L._next = () => { popLayer(L); openOneNote(list[0]); };
  const side = el('div', { id: 'stackBtns', className: 'abs' }, [
    sbtnF('icon_mail', 14, 11, `unfold (${list.length} new)`, 'tall', () => { popLayer(L); openOneNote(list[0]); }),
    sbtnF(null, 0, 0, 'see all new notes', '', () => { popLayer(L); openAllNotes(); }),
    sbtnF(null, 0, 0, 'open my locker →', 'small', () => { popLayer(L); openLocker(ME); }),
  ]);
  L.append(doorEl, el('div', { id: 'stackHint', className: 'abs mtitle', style: 'top:204px;font-size:9px', textContent: `${list.length} new note${list.length > 1 ? 's' : ''} slipped into your locker ✉  press → to unfold` }), side);
  pushLayer(L);
}
function sbtnF(icon, w, h, label, cls, on) { const b = sbtn(icon, w, h, label, cls); b.addEventListener('click', on); return b; }

function openOneNote(n) {
  markViewed(n);
  const left = unviewed();
  const L = el('div', { id: 'oneLayer', className: 'fl' }, [el('div', { className: 'fl-dim' })]);
  const close = () => { popLayer(L); backToHall(); };
  L._esc = close;
  const paper = el('div', { id: 'oneNote', className: 'abs' }, [
    el('span', { className: 'count2', textContent: left.length ? `${left.length} more new` : 'all caught up ✿' }),
    el('div', { className: 'from' }, [img('avatar_' + n.from.id, 24, 24), el('div', {}, [el('b', { textContent: `note from ${n.from.name}` }), el('span', { textContent: `${n.when} · saved to your DMs` })])]),
    el('div', { className: 'body', textContent: n.text })]);
  const side = el('div', { id: 'stackBtns', className: 'abs' }, [
    sbtnF('icon_mail', 14, 11, 'reply in DMs', 'tall', () => { close(); state.dmWith = n; state.dmOpen = true; mailTab = 'received'; openMail(); }),
    sbtnF(null, 0, 0, 'peek at their locker', '', () => { close(); openLocker(n.from); }),
    left.length ? sbtnF(null, 0, 0, 'next note →', '', () => { popLayer(L); openOneNote(left[0]); }) : sbtnF(null, 0, 0, 'no more new notes', 'dimmed', () => {}),
    left.length ? sbtnF(null, 0, 0, 'see all new notes', 'small', () => { popLayer(L); openAllNotes(); }) : sbtnF(null, 0, 0, 'open DMs', 'small', () => { close(); state.dmOpen = false; mailTab = 'received'; openMail(); }),
    sbtnF(null, 0, 0, '← hallway', 'small', close),
  ]);
  if (left.length) L._next = () => { popLayer(L); openOneNote(left[0]); };
  L.append(paper, side); pushLayer(L);
}
function openAllNotes() {
  const L = el('div', { id: 'allLayer', className: 'fl' }, [el('div', { className: 'fl-dim' })]);
  const close = () => { popLayer(L); backToHall(); };
  L._esc = close;
  const list = unviewed();
  const g = el('div', { id: 'allNotes' });
  for (let i = 0; i < 9; i++) {
    const n = list[i];
    if (!n) { g.append(el('div', { className: 'ncard empty2' })); continue; }
    const c = el('button', { className: 'ncard unread', type: 'button' }, [
      el('div', { className: 'h' }, [img('avatar_' + n.from.id, 24, 24, { style: 'width:12px;height:12px' }), el('span', { textContent: 'note from ' + n.from.name.split(' ')[0] })]),
      el('p', { textContent: 'tap to unfold ✉' }), el('span', { className: 'chip', textContent: 'open', style: 'align-self:flex-start;font-size:5.5px;padding:1px 4px' })]);
    c.style.animationDelay = i * 30 + 'ms';
    c.addEventListener('click', () => { popLayer(L); openOneNote(n); });
    g.append(c);
  }
  const dmBtn = btn('viewed notes live in your DMs →', 'chip', () => { close(); state.dmOpen = false; mailTab = 'received'; openMail(); });
  L.append(el('div', { className: 'mtitle', textContent: list.length ? `new notes (${list.length})` : 'all caught up ✿' }), g,
    el('div', { className: 'mclose' }, [btn('close', 'chip', close)]), el('div', { className: 'abs', style: 'left:0;right:0;top:243px;text-align:center' }, [dmBtn]));
  pushLayer(L);
}

addEventListener('keydown', e => { const top = layers[layers.length - 1]; if (e.key === 'ArrowRight' && top && top._next && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) top._next(); });

/* ================================================================
   boot
   ================================================================ */
applySprite();
renderGrid(); updateBadges();
if (location.hash === '#hallway') {
  // skip onboarding: jump straight to the hallway with the example profile
  Object.assign(profile, EXAMPLE); startItems(); profile.live = true; syncMe(); renderGrid(); updateBadges();
  setTimeout(openQuiz, 600);
} else openLogin();
</script>
