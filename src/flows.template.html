<!-- ================================================================
     Flows added on top of the hallway prototype:
       1. login with a synthetic demo email (+ optional invite)
       2. "Make your locker :)" — about you + theme picker + sprite maker
       3. decorate — photo bank / sticker bank / objects, drag, resize, rotate, flip
       4. go live → hallway, daily quiz pops up
       5. past quizzes grid, notes poking out of your locker (stack, single, all)
     Shared records live in demo-model.js; this file adapts the locker editor and flows.
     ================================================================ -->
<style>
#toast { z-index: 90; } /* keep toasts above the flow layers */
/* shared modal + form bits */
.fl { position: absolute; inset: 0; z-index: 50; }
.fl-dim { position: absolute; inset: 0; background: rgba(38, 28, 40, .58); animation: fadeIn .2s both; }
.card2 {
  position: absolute; box-sizing: border-box; background: var(--paper); border: 1px solid var(--ink);
  box-shadow: inset 0 0 0 1px var(--paper), inset 0 0 0 2px var(--paper-3), 0 3px 0 rgba(40,25,30,.35);
  color: var(--ink-deep); animation: popIn .22s cubic-bezier(.2,.9,.3,1.2) both;
}
.card2 h2 { margin: 0; font-size: 11px; font-weight: 700; color: var(--ink); text-align: center; letter-spacing: .2px; }
.sub { font-family: var(--font-talk); font-size: 6.5px; line-height: 9px; color: #8a6a5c; text-align: center; }
.fin {
  font-family: var(--font-talk); font-size: 7px; color: var(--dialog-text); background: #fff; border: 1px solid var(--ink);
  padding: 2px 4px; outline: 0; box-sizing: border-box; width: 100%; border-radius: 0;
}
.fin:focus { border-color: var(--blush-deep); box-shadow: 0 0 0 1px var(--tint); }
.fin::placeholder { color: #b9a69a; }
.bigbtn {
  font-size: 8px; font-weight: 700; padding: 4px 9px; background: #dcebc6; border: 1px solid var(--sage-deep);
  box-shadow: 0 2px 0 var(--sage-deep); color: var(--ink-deep); transition: transform .08s;
}
.bigbtn:hover { transform: translateY(-1px); background: #e8f3d8; }
.bigbtn:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--sage-deep); }
.bigbtn.pink { background: var(--tint); border-color: var(--blush-deep); box-shadow: 0 2px 0 var(--blush-deep); }
.bigbtn.plain { background: var(--paper); border-color: var(--ink); box-shadow: 0 2px 0 var(--wood-dark); }
.bigbtn[disabled] { opacity: .45; pointer-events: none; }
.err { font-family: var(--font-talk); font-size: 6px; color: var(--blush-deep); min-height: 8px; text-align: center; }
.link { font-size: 6.5px; font-weight: 600; color: var(--blush-deep); text-decoration: underline; text-underline-offset: 1px; }

/* ---------- login ---------- */
#login { display: grid; place-items: center; }
#login .card2 { position: relative; width: 220px; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
#login .brand { display: flex; align-items: center; justify-content: center; gap: 4px; }
#login .brand b { font-size: 17px; font-weight: 700; color: var(--ink); text-shadow: 1px 1px 0 var(--paper), 2px 2px 0 var(--paper-3); }
#login .login-section { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
#login .login-mock { border-top: 1px solid var(--paper-3); padding-top: 10px; }
#login .login-section .bigbtn, #login .login-section .fin { box-sizing: border-box; width: 100%; height: 22px; flex: none; padding: 4px 8px; font-size: 8px; line-height: 12px; }
#login .login-section .hint { margin: 0; font-size: 6px; line-height: 8px; text-align: center; }
#login .login-section .lbl { line-height: 7px; }
#login .err { min-height: 0; line-height: 8px; }
#login .err:empty { display: none; }
#login .mailcard { border: 1px dashed var(--paper-3); background: #fff; padding: 5px 6px; text-align: left; }
#login .mailcard b { font-size: 7px; display: block; color: var(--ink); }
#login .mailcard p { margin: 2px 0 4px; font-family: var(--font-talk); font-size: 6.5px; line-height: 8.5px; color: var(--dialog-text); }
.row { display: flex; gap: 5px; align-items: center; justify-content: center; }

/* ---------- editor shell ---------- */
#editor { background: #f4e9d2; }
#editor .ebg { position: absolute; inset: 0; opacity: .22; }
#edTitle { left: 150px; top: 5px; width: 180px; height: 14px; box-sizing: border-box; background: var(--wood); border: 1px solid var(--ink);
  box-shadow: inset 0 1px 0 #ecca97, inset 0 -1px 0 var(--wood-dark), 0 1px 0 #d9c6a2; display: grid; place-items: center; font-size: 7.5px; font-weight: 600; color: var(--ink-deep); }
#edSteps { left: 140px; top: 23px; width: 200px; padding: 2px 0; background: var(--paper); border: 1px solid var(--paper-3); text-align: center; font-size: 5.5px; letter-spacing: .5px; text-transform: uppercase; color: var(--wood-dark); }
#edSteps b { color: var(--blush-deep); }
#edLogo { left: 10px; top: 9px; display: flex; align-items: flex-start; gap: 4px; }
#edLogo b { font-size: 15px; font-weight: 700; color: var(--ink); text-shadow: 1px 1px 0 var(--paper), 2px 2px 0 var(--paper-3); }
#edDoor { left: 30px; top: 47px; width: 176px; height: 152px; }
#edDoor > img { position: absolute; inset: 0; }
#edDoor .card { animation: fadeIn .2s both; }
#edLocker { left: 214px; top: 40px; width: 190px; height: 166px; }
#edLocker > img { position: absolute; inset: 0; }
#edItems { position: absolute; inset: 0; touch-action: none; }
#edRight { left: 409px; top: 40px; width: 62px; height: 166px; }
#edBar { left: 30px; top: 212px; width: 441px; height: 52px; box-sizing: border-box; background: var(--paper); border: 1px solid var(--ink);
  box-shadow: inset 0 0 0 1px var(--paper), inset 0 0 0 2px var(--paper-3), 0 2px 0 rgba(60,40,40,.3); padding: 5px 6px; display: flex; gap: 6px; align-items: center; }
.navbtn { width: 30px; height: 30px; flex: none; border-radius: 50%; background: var(--paper-2); border: 1px solid var(--ink); box-shadow: 0 2px 0 var(--wood-dark); font-size: 7px; font-weight: 700; line-height: 8px; }
.navbtn.go { background: #dcebc6; border-color: var(--sage-deep); box-shadow: 0 2px 0 var(--sage-deep); }
.navbtn:hover { transform: translateY(-1px); }
.lbl { font-size: 5.5px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; color: var(--blush-deep); }
.lbl.dark { color: var(--ink); }
.hint { font-family: var(--font-talk); font-size: 5.5px; line-height: 7px; color: #9a8579; }

/* step 1: the about-you form lives on the inside of the door */
.edcard { position: absolute; left: 20px; top: 17px; width: 136px; height: 116px; display: flex; flex-direction: column; }
.edhead { display: flex; gap: 4px; align-items: center; margin-bottom: 3px; }
.spritebtn { position: relative; width: 24px; height: 24px; flex: none; border-radius: 50%; }
.spritebtn img { border-radius: 50%; }
.spritebtn .pen { position: absolute; right: -3px; bottom: -2px; width: 10px; height: 10px; background: var(--paper); border: 1px solid var(--ink); border-radius: 50%; display: grid; place-items: center; }
.spritebtn:hover { filter: brightness(1.06); transform: translateY(-1px); }
.namein { font-family: var(--font-ui); font-size: 10px; font-weight: 700; color: var(--ink); border: 0; border-bottom: 1px dashed var(--paper-3); background: transparent; width: 100%; padding: 0; outline: 0; }
.prnin { font-family: var(--font-talk); font-size: 6px; color: #8a6a5c; border: 0; border-bottom: 1px dashed var(--paper-3); background: transparent; width: 100%; padding: 0; outline: 0; margin-top: 1px; }
.namein:focus, .prnin:focus { border-bottom-color: var(--blush); }
.edform { flex: 1; overflow-y: auto; min-height: 0; display: grid; grid-template-columns: 30px 1fr; row-gap: 2px; column-gap: 3px; align-items: center; padding-right: 2px; }
.edform::-webkit-scrollbar { width: 3px; } .edform::-webkit-scrollbar-thumb { background: var(--paper-3); }
.edform label { font-size: 5px; font-weight: 600; letter-spacing: .3px; text-transform: uppercase; color: var(--blush-deep); line-height: 6px; }
.edform input, .edform select { font-family: var(--font-talk); font-size: 6.5px; color: var(--dialog-text); border: 0; border-bottom: 1px solid #e9dcc6; background: transparent; padding: 1px 0; outline: 0; min-width: 0; border-radius: 0; }
.edform input:focus, .edform select:focus { border-bottom-color: var(--blush); background: var(--tint-2); }
.edform input::placeholder { color: #c6b3a6; }
.edform .full { grid-column: 1 / -1; }
.tagprev { display: flex; flex-wrap: wrap; gap: 2px; min-height: 9px; }

.swrow { display: flex; gap: 3px; overflow-x: auto; padding: 3px 3px 3px; margin: -2px -3px; scrollbar-width: none; }
.swrow::-webkit-scrollbar { display: none; }
.sw { width: 13px; height: 13px; flex: none; border: 1px solid var(--ink); box-sizing: border-box; padding: 0; position: relative; }
.sw img { width: 11px; height: 11px; }
.sw[aria-pressed="true"] { outline: 1px solid var(--blush-deep); outline-offset: 1px; }
.sw.round { border-radius: 50%; }
.grp { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

#edOutside { position: absolute; left: 0; top: 4px; width: 64px; height: 64px; }
#edOutside img { position: absolute; }
.stkpick { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 3px; width: 62px; }
.stkpick button { width: 18px; height: 18px; border: 1px solid var(--paper-3); background: #fff; display: grid; place-items: center; font-size: 6px; color: #9a8579; }
.stkpick button[aria-pressed="true"] { border-color: var(--blush-deep); background: var(--tint-2); }

/* step 2: decorate */
.bank { box-sizing: border-box; width: 62px; background: var(--paper); border: 1px solid var(--ink); box-shadow: 0 2px 0 rgba(60,40,40,.25); padding: 3px; display: flex; flex-direction: column; gap: 2px; }
.bank .bgrid { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 2px; align-content: flex-start; }
.bank .bgrid::-webkit-scrollbar { width: 2px; } .bank .bgrid::-webkit-scrollbar-thumb { background: var(--paper-3); }
.chipbtn { font-size: 6px; font-weight: 600; padding: 1px 4px; border: 1px solid var(--ink); background: var(--paper-2); box-shadow: 0 1px 0 var(--wood-dark); }
.chipbtn:hover { background: #fff; }
.drag { cursor: grab; padding: 1px; border: 1px solid transparent; touch-action: none; }
.drag:hover { border-color: var(--paper-3); background: #fff; }
.objstrip { flex: 1; min-width: 0; display: flex; gap: 3px; align-items: flex-end; overflow-x: auto; padding: 2px 2px 3px; height: 34px; box-sizing: border-box; }
.objstrip::-webkit-scrollbar { height: 3px; } .objstrip::-webkit-scrollbar-thumb { background: var(--paper-3); }
.placed { position: absolute; cursor: grab; touch-action: none; }
.placed:hover, .placed.sel { filter: drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff) drop-shadow(0 1px 0 #fff) drop-shadow(0 -1px 0 #fff); }
.placed.sel { filter: drop-shadow(1px 0 0 var(--blush)) drop-shadow(-1px 0 0 var(--blush)) drop-shadow(0 1px 0 var(--blush)) drop-shadow(0 -1px 0 var(--blush)); }
.placed .editdot { position: absolute; right: -4px; top: -4px; width: 8px; height: 8px; border-radius: 50%; background: var(--paper); border: 1px solid var(--ink); opacity: 0; pointer-events: none; display: grid; place-items: center; }
.placed:hover .editdot { opacity: 1; }
.ghost { position: absolute; pointer-events: none; z-index: 60; opacity: .85; }
.insp { flex: 1; display: grid; grid-template-columns: 96px 1fr auto; gap: 6px; align-items: stretch; min-width: 0; height: 40px; }
.insp .grp { justify-content: flex-start; }
.insp textarea { resize: none; height: 31px; font-family: var(--font-talk); font-size: 6.5px; line-height: 8px; }
.tools { display: grid; grid-template-columns: repeat(5, 16px); gap: 2px; align-content: start; }
.tool { height: 15px; border: 1px solid var(--ink); background: var(--paper); box-shadow: 0 1px 0 var(--wood-dark); font-size: 7px; font-weight: 700; display: grid; place-items: center; }
.tool:hover { background: #fff; transform: translateY(-1px); }
.tool.del { background: var(--tint); }
.tool.ok { background: #dcebc6; grid-column: span 3; font-size: 6px; }
.wallhint { position: absolute; left: 0; right: 0; bottom: -10px; text-align: center; }

/* step 3: go live */
#goLive { left: 410px; top: 40px; width: 62px; display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center; }

/* ---------- upload modal ---------- */
#upModal .card2 { left: 90px; top: 44px; width: 300px; height: 180px; padding: 10px 12px; display: grid; grid-template-columns: 150px 1fr; grid-template-rows: auto 1fr auto; gap: 6px 10px; }
#upModal h2 { grid-column: 1 / -1; }
.drop { border: 1px dashed var(--ink); background: var(--paper-2) repeating-linear-gradient(45deg, transparent 0 4px, rgba(255,255,255,.5) 4px 8px); display: grid; place-items: center; text-align: center; position: relative; }
.drop.over { background-color: var(--tint); }
.drop img { image-rendering: pixelated; }
.upr { display: flex; flex-direction: column; gap: 4px; }
.upr textarea { flex: 1; resize: none; font-family: var(--font-talk); font-size: 7px; line-height: 9px; }
.upbtns { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 6px; }

/* ---------- sprite maker ---------- */
#spriteModal .card2 { left: 70px; top: 30px; width: 340px; height: 206px; padding: 9px 10px; }
.spr { position: absolute; left: 10px; top: 26px; right: 10px; bottom: 30px; display: grid; grid-template-columns: 50px 150px 1fr; gap: 6px; }
.sprtabs { display: flex; flex-direction: column; gap: 3px; }
.sprtab { font-size: 7px; font-weight: 600; padding: 3px 0; border: 1px solid var(--ink); background: var(--paper-2); }
.sprtab[aria-selected="true"] { background: var(--ink-deep); color: var(--paper); }
.sprpanel { background: #fff; border: 1px solid var(--paper-3); padding: 4px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
.opts { display: flex; flex-wrap: wrap; gap: 2px; }
.opt { border: 1px solid var(--paper-3); background: var(--paper); padding: 0; line-height: 0; }
.opt img { image-rendering: pixelated; }
.opt[aria-pressed="true"] { border-color: var(--blush-deep); background: var(--tint-2); box-shadow: 0 0 0 1px var(--tint); }
.sprprev { background: var(--paper-2) repeating-conic-gradient(#efe2c9 0 25%, transparent 0 50%) 0 0 / 12px 12px; border: 1px solid var(--paper-3); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.sprprev img { width: 96px; height: 96px; }
.colorin { width: 18px; height: 13px; padding: 0; border: 1px solid var(--ink); background: none; cursor: pointer; }
.sprfoot { position: absolute; left: 10px; right: 10px; bottom: 8px; display: flex; justify-content: space-between; align-items: center; }

/* ---------- daily quiz ---------- */
#quizModal .card2 { left: 122px; top: 16px; width: 236px; height: 232px; padding: 9px 14px; display: flex; flex-direction: column; gap: 5px; }
.qbox { background: var(--paper-2); border: 1px solid var(--paper-3); padding: 5px 6px; font-family: var(--font-talk); font-size: 8px; line-height: 10.5px; color: var(--dialog-text); }
.qkind { font-family: var(--font-ui); font-size: 5.5px; letter-spacing: .4px; text-transform: uppercase; color: var(--blush-deep); display: block; margin-bottom: 2px; }
.qopts { display: flex; flex-direction: column; gap: 2px; flex: 1; min-height: 0; }
.qopt { text-align: left; font-family: var(--font-talk); font-size: 7px; padding: 2px 6px; border: 1px solid var(--paper-3); background: #fff; color: var(--dialog-text); display: flex; gap: 5px; align-items: center; }
.qopt::before { content: ""; width: 5px; height: 5px; border: 1px solid var(--ink); border-radius: 50%; flex: none; background: #fff; }
.qopt[aria-pressed="true"] { border-color: var(--blush-deep); background: var(--tint-2); }
.qopt[aria-pressed="true"]::before { background: var(--blush); box-shadow: inset 0 0 0 1px #fff; }
.qfoot { display: flex; justify-content: space-between; align-items: center; }
.qdone { text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; flex: 1; justify-content: center; }
.qdone .big { font-size: 13px; font-weight: 700; color: var(--ink); }
.stat { font-family: var(--font-talk); font-size: 6.5px; color: var(--dialog-text); background: #fff; border: 1px solid var(--paper-3); padding: 3px 6px; }

/* ---------- past quizzes ---------- */
#pastModal .grid9 { position: absolute; left: 70px; top: 38px; width: 340px; height: 200px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 5px; }
.qcard { background: var(--paper); border: 1px solid var(--ink); box-shadow: 0 2px 0 rgba(40,25,30,.3); padding: 4px 5px; display: flex; flex-direction: column; gap: 2px; animation: popIn .25s both; text-align: left; overflow: hidden; }
.qcard .d { font-size: 5px; letter-spacing: .4px; text-transform: uppercase; color: var(--wood-dark); }
.qcard .q { font-family: var(--font-talk); font-size: 6.5px; line-height: 8px; color: var(--dialog-text); flex: 1; }
.qcard .a { align-self: flex-start; font-size: 6px; font-weight: 600; padding: 1px 4px; background: var(--tint); border: 1px solid var(--blush-deep); color: var(--ink-deep); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-sizing: border-box; }
.qcard .m { font-size: 5px; color: var(--sage-deep); }
.qcard.today { background: #fffdf5; border-color: var(--blush-deep); }
.mtitle { position: absolute; left: 0; right: 0; top: 12px; text-align: center; font-size: 12px; font-weight: 700; color: var(--paper); text-shadow: 1px 1px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink); }
.mclose { position: absolute; right: 14px; top: 14px; }

/* ---------- notes: your locker zoom, single note, all notes ---------- */
.locker .notepeek { position: absolute; left: 29px; top: 8px; animation: wiggle 1.6s steps(2) infinite; }
@keyframes wiggle { 50% { transform: rotate(-6deg) translateY(-1px); } }
#stackDoor { left: 152px; top: 44px; width: 176px; height: 152px; animation: popIn .28s cubic-bezier(.2,.9,.3,1.3) both; }
#stackDoor > img { position: absolute; inset: 0; }
.slip { position: absolute; width: 40px; height: 22px; border-bottom: 2px solid #2a2440; background: var(--paper); border: 1px solid var(--ink); box-sizing: border-box;
  background-image: repeating-linear-gradient(180deg, transparent 0 5px, #d6e4ef 5px 6px); box-shadow: 0 1px 0 rgba(0,0,0,.2); transition: transform .3s; }
.slip b { position: absolute; left: 3px; bottom: 2px; font-size: 5px; color: var(--blush-deep); background: var(--paper); padding: 0 1px; }
#stackDoor:hover .slip.top { transform: translateY(-3px) rotate(-4deg); }
#stackHint { left: 0; right: 0; top: 204px; text-align: center; }
#stackBtns { left: 410px; top: 44px; display: flex; flex-direction: column; gap: 6px; width: 58px; }
#oneNote { left: 112px; top: 26px; width: 256px; height: 200px; box-sizing: border-box; background-color: var(--paper);
  background-image: linear-gradient(90deg, transparent 21px, #e2a48f 21px, #e2a48f 22px, transparent 22px), repeating-linear-gradient(180deg, transparent 0 13px, #d6e4ef 13px 14px);
  background-position: 0 0, 0 40px; border: 1px solid var(--ink); box-shadow: 0 3px 0 rgba(40,25,30,.35); padding: 10px 12px 8px 30px; animation: unfold .35s cubic-bezier(.2,.9,.3,1.1) both; transform-origin: 50% 0; }
@keyframes unfold { from { transform: scaleY(.15) rotate(-3deg); opacity: .4; } }
#oneNote .from { display: flex; gap: 5px; align-items: center; margin-bottom: 8px; }
#oneNote .from b { font-size: 9px; color: var(--ink); display: block; }
#oneNote .from span { font-family: var(--font-talk); font-size: 6px; color: #8a6a5c; }
#oneNote .body { font-family: var(--font-talk); font-size: 8px; line-height: 14px; color: var(--dialog-text); }
#oneNote .count2 { position: absolute; right: 8px; top: 8px; font-size: 6px; color: #b9a69a; }
#allNotes { position: absolute; left: 70px; top: 38px; width: 340px; height: 200px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 5px; }
.ncard { background: var(--paper); border: 1px solid var(--ink); box-shadow: 0 2px 0 rgba(40,25,30,.3); padding: 4px 5px; display: flex; flex-direction: column; gap: 2px; text-align: left; animation: popIn .25s both; background-image: repeating-linear-gradient(180deg, transparent 0 9px, #e6eef5 9px 10px); }
.ncard .h { display: flex; gap: 3px; align-items: center; font-size: 6.5px; font-weight: 700; color: var(--ink); }
.ncard p { margin: 0; font-family: var(--font-talk); font-size: 6px; line-height: 8px; color: var(--dialog-text); flex: 1; overflow: hidden; }
.ncard.unread { border-color: var(--blush-deep); }
.mail.unread { border-color: var(--blush); background: var(--tint-2); }
.ncard.empty2 { background: rgba(255,250,240,.12); border: 1px dashed rgba(255,250,240,.35); box-shadow: none; }
.ncard:not(.empty2):hover { transform: translateY(-1px); background-color: #fff; }

/* ---------- v2: Mittens, messages ---------- */
#mittens { position: absolute; z-index: 4; line-height: 0; cursor: pointer; }
#mittens img { image-rendering: pixelated; filter: drop-shadow(0 1px 0 rgba(40,25,20,.35)); }
#mittens.flip img { transform: scaleX(-1); }
#mittens .meow { position: absolute; left: -8px; top: -11px; font-size: 6px; font-weight: 700; color: var(--ink-deep); background: var(--paper); border: 1px solid var(--ink); padding: 0 2px; line-height: 7px; opacity: 0; transition: opacity .1s; white-space: nowrap; }
#mittens.talking .meow { opacity: 1; }
#stage.viewing #mittens { visibility: hidden; }
#dmBox { left: 90px; top: 26px; width: 300px; height: 214px; box-sizing: border-box; background: var(--paper); border: 1px solid var(--ink);
  box-shadow: 0 3px 0 rgba(40,25,30,.35); display: flex; flex-direction: column; animation: popIn .2s both; }
.dmhead { display: flex; align-items: center; gap: 5px; padding: 6px 8px; border-bottom: 1px solid var(--paper-3); }
.dmhead > b { flex: 1; font-size: 10px; color: var(--ink); }
.dmhead .mid { flex: 1; min-width: 0; }

function openLogin() {
  const L = el('div', { id: 'login', className: 'fl' }, [el('div', { className: 'fl-dim' })]);
  const card = el('div', { className: 'card2' });
  L.append(card); pushLayer(L);
  const brand = () => el('div', { className: 'brand' }, [img('logo_mark', 12, 16), img('logo_word', 96, 19, { alt: 'homeroom' })]);

  const stepEmail = () => {
    card.innerHTML = '';
    const google = btn('sign in with Google', 'bigbtn', () => { location.href = '/auth/google'; });
    google.disabled = !useBackend || !backendConfig?.GoogleConfigured;
    const input = el('input', { id: 'loginEmail', className: 'fin', type: 'email', placeholder: 'oski@berkeley.edu', value: profile.email, autocomplete: 'off', maxLength: 254 });
    const err = el('div', { className: 'err' });
    err.setAttribute('aria-live', 'polite');
    const go = btn('enter mock mode →', 'bigbtn pink');
    const submit = async () => {
      const email = input.value.trim().toLowerCase();
      if (email.length > 254 || !/^[^@\s]+@berkeley\.edu$/.test(email)) { err.textContent = 'use a made-up @berkeley.edu email'; input.focus(); return; }
      profile.email = email; go.disabled = true;
      try {
        if (useBackend) await appModel.loginMock(email);
        popLayer(L); await openEditor(1);
      } catch (error) { err.textContent = error.message; go.disabled = false; }
    };
    go.addEventListener('click', submit); input.addEventListener('keydown', e => e.key === 'Enter' && submit());
    card.append(brand(),
      el('div', { className: 'login-section' }, [google,
        el('p', { className: 'hint', textContent: 'sign in with your Berkeley email. your profile and history are saved.' })]),
      el('div', { className: 'login-section login-mock' }, [
        el('label', { className: 'lbl dark', htmlFor: 'loginEmail', textContent: 'complete mock mode' }), input, err, go,
        el('p', { className: 'hint', textContent: 'use a made-up Berkeley email. nothing is saved after reload.' })]));
    setTimeout(() => input.focus(), 50);
  };
  const stepInvite = () => {
    card.innerHTML = '';
    const input = el('input', { className: 'fin', type: 'email', placeholder: 'friend@berkeley.edu', autocomplete: 'off' });
    const err = el('div', { className: 'err' });
    const send = btn('record invite', 'chipbtn', async () => {
      if (!/^[^@\s]+@berkeley\.edu$/.test(input.value.trim())) { err.textContent = 'needs to be a @berkeley.edu email'; return; }
      send.disabled = true;
      try { await appModel.invite(input.value.trim().toLowerCase()); err.style.color = 'var(--sage-deep)'; err.textContent = 'invite recorded ✿ share the app link with them; no email is sent'; input.value = ''; } catch (error) { err.textContent = error.message; } finally { send.disabled = false; }
    });
    card.append(brand(), el('div', { className: 'sub', textContent: 'you’re in! invite someone to join? (optional)' }),
      el('div', { className: 'row' }, [input, send]), err,
      el('div', { className: 'sub', textContent: 'next up: build your locker. it’s like a little profile your neighbors can peek into.' }),
      el('div', { className: 'row' }, [btn('make my locker →', 'bigbtn', () => { popLayer(L); openEditor(1); })]));
  };
  stepEmail();
}

async function srcCanvas(it) {

// photo upload → pixel polaroid, drawn the same way as polaroid() in assets.py
function pixelate(image, pw, ph) {
  const iw = image.naturalWidth || image.width, ih = image.naturalHeight || image.height;

  const [c, x] = canvas(pw, ph); x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high'; x.drawImage(m, 0, 0, pw, ph);

}

  const inside = (px, py) => px >= 0 && py >= 0 && px < w && py < h && (opaque ? !((px === 0 || px === w - 1) && (py === 0 || py === h - 1)) : d.data[(py * w + px) * 4 + 3] > 128);

    let near = false; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (inside(px + dx, py + dy)) near = true;
    if (near) { x.fillStyle = 'rgba(0,0,0,.16)'; x.fillRect(px + 2, py + 2, 1, 1); }
  }
  for (let py = -1; py <= h; py++) for (let px = -1; px <= w; px++) {
    let near = false; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (inside(px + dx, py + dy)) near = true;

function secsToMidnightPT() {
  const state = appModel?.data;
  if (state?.ServerNow && state.NextRefreshAt) return Math.max(0, Math.ceil((Date.parse(state.NextRefreshAt) - Date.parse(state.ServerNow) - (Date.now() - appModel.receivedAt)) / 1000));
  return Math.max(0, Math.ceil((HomeroomDemo.midnight(HomeroomDemo.shiftDay(HomeroomDemo.day(), 1)) - Date.now()) / 1000));
}
function tickCountdown() {
  const s = secsToMidnightPT(), pad = n => String(n).padStart(2, '0');

}

  M.t++;

      while (ui.facts.length < 3) ui.facts.push(['', '']);

        if (placement.SpotifyTrack) {

    for (const media of state.MediaBucket.Assets.filter(a => a.OwnerPersonID === own.PersonID)) {

      const raw = await loadImg(assetSource(media)); const kind = media.Kind === 'Photo' ? 'photo' : 'sticker';
