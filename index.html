<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Homeroom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one fixed 480x270 pixel stage (1 CSS px = 1 art px), scaled to fit the window like a game screen. */
:root {
  --ink: #6e4a3c;        /* warm brown outline, same as the art */
  --ink-deep: #4f362e;
  --paper: #fffaf0;      /* cream */
  --paper-2: #f3e6cf;
  --paper-3: #e2cfae;
  --wood: #ddb07a;
  --wood-dark: #c9945f;
  --blush: #ef8fa6;
  --blush-deep: #c46f8b;
  --sage: #a9cd72;
  --sage-deep: #64924f;
  --dialog-text: #4a3f5c;
  --letterbox: #2f2a2c;
  --font-ui: "Pixelify Sans", "Silkscreen", ui-monospace, monospace;
  --font-talk: "DotGothic16", "MS Gothic", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--letterbox); color: var(--paper);
  display: grid; place-items: center; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px; box-sizing: border-box;
}
#fit { position: relative; }
#stage {
  position: absolute; left: 0; top: 0; width: 480px; height: 270px;
  transform-origin: 0 0; overflow: hidden; background: #f4e9d2;
  font-family: var(--font-ui); color: var(--ink-deep);
}
#stage img { image-rendering: pixelated; image-rendering: crisp-edges; display: block; max-width: none; user-select: none; -webkit-user-drag: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 1px dashed var(--blush-deep); outline-offset: 1px; }
.abs { position: absolute; }

/* ---------- home ---------- */
#logo { left: 12px; top: 18px; display: flex; align-items: center; gap: 4px; }
#logo b { font-size: 19px; font-weight: 700; letter-spacing: .2px; color: var(--ink); text-shadow: 1px 1px 0 var(--paper), 2px 2px 0 var(--paper-3); line-height: 1; }
#logo small { display: block; font-family: var(--font-ui); font-size: 5.5px; letter-spacing: .6px; text-transform: uppercase; color: var(--wood-dark); margin-top: 2px; }
#sign {
  left: 132px; top: 17px; width: 216px; height: 14px; box-sizing: border-box;
  background: var(--wood); border: 1px solid var(--ink);
  box-shadow: inset 0 1px 0 #ecca97, inset 0 -1px 0 var(--wood-dark), 0 1px 0 #d9c6a2;
  display: grid; place-items: center; font-size: 7.5px; font-weight: 600; color: var(--ink-deep); letter-spacing: .1px;
}
#sign::before, #sign::after { content: ""; position: absolute; top: 5px; width: 2px; height: 2px; background: var(--ink); }
#sign::before { left: 3px; } #sign::after { right: 3px; }
#topbtns { right: 14px; top: 20px; display: flex; gap: 5px; align-items: center; }
.ibtn {
  width: 22px; height: 22px; display: grid; place-items: center; position: relative;
  background: var(--paper); border: 1px solid var(--ink); box-shadow: 0 2px 0 var(--wood-dark);
  transition: transform .08s;
}
.ibtn:hover { transform: translateY(-1px); background: #fff; }
.ibtn:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--wood-dark); }
.ibtn.round { border-radius: 50%; width: 24px; height: 24px; padding: 0; overflow: visible; background: none; border: 0; box-shadow: none; }
.ibtn.round img { border-radius: 50%; }
.badge { position: absolute; right: -3px; top: -3px; min-width: 7px; height: 7px; padding: 0 1px; background: var(--blush); border: 1px solid var(--blush-deep); color: #fff; font-size: 5.5px; line-height: 7px; text-align: center; font-weight: 700; }
.tip { position: absolute; top: 25px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 5.5px; color: var(--ink); background: var(--paper); border: 1px solid var(--ink); padding: 1px 2px; opacity: 0; pointer-events: none; transition: opacity .12s; }
.ibtn:hover .tip, .ibtn:focus-visible .tip { opacity: 1; }

.locker { position: absolute; width: 64px; height: 64px; }
.locker > img.tile { position: absolute; inset: 0; }
.locker:hover > img.tile, .locker:focus-visible > img.tile { filter: brightness(1.1) saturate(1.05); }
.locker:hover .shine, .locker:focus-visible .shine { opacity: 1; }
.shine { position: absolute; inset: 1px; border: 1px solid #fff; opacity: 0; transition: opacity .12s; pointer-events: none; }
.locker .stk { position: absolute; }
.youplate {
  position: absolute; left: 18px; top: 22px; width: 24px; height: 11px; box-sizing: border-box;
  background: var(--paper); border: 1px solid var(--ink); display: grid; place-items: center;
  font-size: 7px; font-weight: 700; color: var(--blush-deep); letter-spacing: .5px; box-shadow: 0 1px 0 rgba(0,0,0,.25);
}
.peek { position: absolute; left: 50%; top: -9px; transform: translateX(-50%); font-size: 6px; background: var(--paper); border: 1px solid var(--ink); color: var(--ink-deep); padding: 0 2px; white-space: nowrap; opacity: 0; pointer-events: none; z-index: 2; }
.locker:hover .peek, .locker:focus-visible .peek { opacity: 1; }

/* ---------- dialogue box (shared) ---------- */
.dialog {
  position: absolute; box-sizing: border-box; background: var(--paper);
  border: 1px solid var(--ink); box-shadow: inset 0 0 0 1px var(--paper), inset 0 0 0 2px var(--paper-3), 0 2px 0 rgba(60,40,40,.35);
  clip-path: polygon(1px 0, calc(100% - 1px) 0, 100% 1px, 100% calc(100% + 3px), 0 calc(100% + 3px), 0 1px);
  padding: 6px 9px 5px; color: var(--dialog-text); font-family: var(--font-talk);
}
.dialog .txt { font-size: 7.5px; line-height: 10.5px; letter-spacing: .15px; white-space: pre-wrap; }
.dialog .more { position: absolute; right: 6px; bottom: 3px; width: 0; height: 0; border-left: 3px solid transparent; border-right: 3px solid transparent; border-top: 3px solid var(--dialog-text); animation: bob 1s steps(2) infinite; }
.nametab { position: absolute; z-index: 3; background: var(--ink-deep); color: var(--paper); font-family: var(--font-ui); font-size: 7px; font-weight: 600; padding: 1px 5px 1px; letter-spacing: .3px; box-shadow: 0 0 0 1px var(--paper); }
@keyframes bob { 50% { transform: translateY(1px); } }
#homeDialog { left: 104px; top: 243px; width: 272px; height: 24px; padding: 4px 8px; }
#homeDialog .txt { font-size: 7px; line-height: 9px; }
#homeTab { left: 110px; top: 236px; }

/* ---------- open locker view ---------- */
#viewer { inset: 0; z-index: 10; }
#stage.viewing #homeDialog, #stage.viewing #homeTab { visibility: hidden; }
#dim { inset: 0; background: rgba(38, 28, 40, .58); animation: fadeIn .2s ease-out both; }
@keyframes fadeIn { from { opacity: 0; } }
#lockerWrap { left: 214px; top: 40px; width: 190px; height: 166px; perspective: 700px; perspective-origin: 50% 50%; animation: popIn .28s cubic-bezier(.2,.9,.3,1.3) both; }
@keyframes popIn { from { transform: scale(.82); opacity: 0; } }
#interior { position: absolute; inset: 0; }
#items { position: absolute; inset: 0; z-index: 0; }
.item { position: absolute; transition: transform .1s; }
.item:hover, .item:focus-visible, .item.sel {
  transform: translateY(-1px);
  filter: drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff) drop-shadow(0 1px 0 #fff) drop-shadow(0 -1px 0 #fff);
}
.item:focus-visible { outline: none; }
#door { position: absolute; left: 7px; top: -69px; width: 352px; height: 304px; z-index: 1; transform-style: preserve-3d; transform-origin: 0 50%; transform: scale(.5); transition: transform .9s cubic-bezier(.25,.85,.3,1); }
#viewer.open #door { transform: rotateY(-150deg) scale(.5); }
.face .inner { position: absolute; left: 0; top: 0; width: 176px; height: 152px; transform: scale(2); transform-origin: 0 0; }
#viewer.closing #door { transition-duration: .45s; transition-timing-function: ease-in; }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.face.back { transform: rotateY(180deg); }
.card { position: absolute; left: 20px; top: 17px; right: 20px; bottom: 19px; color: var(--ink-deep); }
.card .who { display: flex; gap: 5px; align-items: center; }
.card .who b { display: block; font-size: 13px; font-weight: 700; line-height: 1; color: var(--ink); }
.card .who span { display: block; font-family: var(--font-talk); font-size: 6px; line-height: 8px; color: #8a6a5c; margin-top: 2px; }
.pills { display: flex; flex-wrap: wrap; gap: 2px; margin: 6px 0 4px; }
.pill { font-size: 5.5px; font-weight: 600; letter-spacing: .3px; padding: 1px 3px; border: 1px solid currentColor; line-height: 6px; }
.facts { display: grid; grid-template-columns: 26px 1fr; row-gap: 3px; column-gap: 3px; align-items: baseline; }
.facts dt { font-size: 5px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; color: var(--blush-deep); }
.facts dd { margin: 0; font-family: var(--font-talk); font-size: 6.5px; line-height: 8px; color: var(--dialog-text); min-width: 0; }

#sidebtns { left: 410px; top: 44px; display: flex; flex-direction: column; gap: 6px; width: 58px; animation: fadeIn .3s .35s both; }
.sbtn {
  display: flex; align-items: center; gap: 4px; padding: 4px 5px; box-sizing: border-box; min-height: 22px;
  background: var(--paper); border: 1px solid var(--ink); box-shadow: 0 2px 0 var(--wood-dark);
  font-size: 7.5px; font-weight: 600; color: var(--ink-deep); text-align: left; line-height: 8px; transition: transform .08s;
}
.sbtn:hover { transform: translateY(-1px); background: #fff; }
.sbtn:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--wood-dark); }
.sbtn.tall { min-height: 30px; }
.sbtn.small { min-height: 15px; font-size: 6.5px; background: var(--paper-2); }
.sbtn.liked { background: #fde0e8; border-color: var(--blush-deep); }
.sbtn.sent { background: #dcebc6; border-color: var(--sage-deep); box-shadow: 0 2px 0 var(--sage-deep); cursor: default; }
.sbtn.sent:hover { transform: none; background: #dcebc6; }
.sbtn.dimmed { background: #d9cfc0; color: #9a8b7e; border-color: #9a8b7e; box-shadow: 0 2px 0 #b9ab98; pointer-events: none; }
.sbtn.dimmed img { filter: grayscale(1) opacity(.5); }
.heartpop { position: absolute; pointer-events: none; animation: floatUp .9s ease-out forwards; }
@keyframes floatUp { to { transform: translate(var(--dx), -26px); opacity: 0; } }

#lockerDialog { left: 96px; top: 221px; width: 290px; height: 42px; z-index: 5; animation: fadeIn .3s .4s both; }
#lockerTab { left: 104px; top: 213px; z-index: 6; animation: fadeIn .3s .4s both; }

/* ---------- note ---------- */
#noteLayer { inset: 0; z-index: 20; }
#noteDim, .ndim { inset: 0; background: rgba(38, 28, 40, .55); animation: fadeIn .15s both; }
#paper {
  left: 112px; top: 26px; width: 256px; height: 212px; box-sizing: border-box;
  background-color: var(--paper);
  background-image: linear-gradient(90deg, transparent 21px, #f2b9c4 21px, #f2b9c4 22px, transparent 22px);
  border: 1px solid var(--ink); box-shadow: 0 3px 0 rgba(40,25,30,.35);
  padding: 9px 12px 8px 28px; animation: popIn .22s cubic-bezier(.2,.9,.3,1.2) both;
  display: flex; flex-direction: column;
}
#paper h2 { margin: 0; font-size: 11px; font-weight: 700; color: var(--ink); text-align: center; }
#paper .to { font-family: var(--font-talk); font-size: 7px; color: #8a6a5c; margin: 4px 0 4px; text-align: center; }
#noteText {
  flex: 1; resize: none; border: 0; outline: 0; background: transparent; margin-top: 4px;
  font-family: var(--font-talk); font-size: 8px; line-height: 12px; color: var(--dialog-text); padding: 0; min-height: 0;
  background-image: repeating-linear-gradient(180deg, transparent 0 11px, #d6e4ef 11px 12px); background-attachment: local;
}
#noteText::placeholder { color: #b9a69a; }
.starters { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 5px; }
.starter { font-family: var(--font-talk); font-size: 6px; padding: 1px 4px; border: 1px solid var(--paper-3); background: #fff; color: var(--dialog-text); }
.starter:hover { border-color: var(--blush); background: #fff4f6; }
.count { font-size: 5.5px; color: #b9a69a; text-align: right; margin-top: 3px; }
#noteBtns { left: 410px; top: 44px; display: flex; flex-direction: column; gap: 6px; width: 58px; z-index: 21; }
.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }

#sentLayer { inset: 0; z-index: 30; }
#env { left: 180px; top: 78px; width: 120px; height: 80px; }
#env img { position: absolute; inset: 0; }
#letter { position: absolute; left: 22px; top: -30px; width: 76px; height: 54px; background: var(--paper); border: 1px solid var(--ink); background-image: repeating-linear-gradient(180deg, transparent 0 6px, #d6e4ef 6px 7px); }
#sentTxt { left: 0; right: 0; top: 168px; text-align: center; font-size: 22px; font-weight: 700; color: var(--paper); text-shadow: 2px 2px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink); letter-spacing: 1px; }

/* ---------- mailbox ---------- */
#mailLayer { inset: 0; z-index: 25; }
#mailDim { inset: 0; background: rgba(38, 28, 40, .35); }
#mailbox {
  right: 14px; top: 46px; width: 200px; height: 186px; box-sizing: border-box;
  background: var(--paper); border: 1px solid var(--ink); box-shadow: 0 3px 0 rgba(40,25,30,.35);
  padding: 8px 9px; display: flex; flex-direction: column; animation: popIn .2s both;
}
#mailbox h2 { margin: 0 0 5px; font-size: 10px; color: var(--ink); display: flex; justify-content: space-between; align-items: center; }
.tabs { display: flex; gap: 3px; margin-bottom: 5px; }
.tab { font-size: 6.5px; font-weight: 600; padding: 2px 5px; border: 1px solid var(--ink); background: var(--paper-2); }
.tab[aria-selected="true"] { background: var(--ink-deep); color: var(--paper); }
#mailBody { flex: 1; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 4px; }
.mail { display: flex; gap: 5px; padding: 4px; border: 1px solid var(--paper-3); background: #fff; text-align: left; align-items: flex-start; }
.mail img { flex: none; }
.mail b { font-size: 7px; display: block; color: var(--ink); }
.mail p { margin: 1px 0 0; font-family: var(--font-talk); font-size: 6.5px; line-height: 8.5px; color: var(--dialog-text); }
.mail .when { font-size: 5px; color: #b9a69a; }
.mailact { display: flex; gap: 4px; margin-top: 4px; }
.chip { font-size: 6.5px; font-weight: 600; padding: 2px 5px; border: 1px solid var(--ink); background: var(--paper); box-shadow: 0 1px 0 var(--wood-dark); }
.chip.go { background: #dcebc6; border-color: var(--sage-deep); box-shadow: 0 1px 0 var(--sage-deep); }
.bubble { max-width: 75%; font-family: var(--font-talk); font-size: 7px; line-height: 9px; padding: 3px 5px; border: 1px solid var(--paper-3); background: #fff; color: var(--dialog-text); }
.bubble.me { align-self: flex-end; background: #fde0e8; border-color: var(--blush); }
.dmform { display: flex; gap: 3px; margin-top: 4px; }
.dmform input { flex: 1; min-width: 0; font-family: var(--font-talk); font-size: 7px; border: 1px solid var(--ink); padding: 2px 3px; background: #fff; color: var(--dialog-text); outline: 0; }
.empty { font-family: var(--font-talk); font-size: 7px; color: #8a6a5c; text-align: center; margin-top: 30px; line-height: 10px; }

#toast { left: 50%; top: 40px; transform: translateX(-50%); z-index: 40; background: var(--ink-deep); color: var(--paper); font-size: 7px; padding: 4px 8px; border: 1px solid var(--paper); white-space: nowrap; animation: fadeIn .15s both; }
#narrow { display: none; }
@media (max-width: 520px) and (orientation: portrait) {
  #narrow { display: block; font-family: "Pixelify Sans", ui-monospace, monospace; color: var(--paper-2); font-size: 13px; text-align: center; margin-top: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
}
/* Song picker and Spotify player. */
.music-item-label { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.music-overlay { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 24px; background: rgba(38,28,40,.72); color: var(--ink-deep); }
.music-window { width: min(560px, 100%); max-height: calc(100dvh - 48px); overflow: auto; box-sizing: border-box; background: var(--paper); border: 3px solid var(--ink); box-shadow: 6px 6px 0 #4f362e, inset 0 0 0 3px var(--paper-3); font-family: var(--font-talk); padding: 22px 24px; position: relative; color-scheme: light; }
.music-window button, .music-window input, .music-window textarea { font: inherit; }
.music-window button:focus-visible, .music-window a:focus-visible { outline: 2px solid var(--blush-deep); outline-offset: 3px; }
.music-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 18px; }
.music-heading h2 { font-family: var(--font-ui); font-size: 26px; line-height: 1.1; color: var(--ink); margin: 0; }
.music-heading p { margin: 0; font-size: 14px; color: #8a6a5c; }
.music-close { display: grid; place-items: center; box-sizing: border-box; width: 30px; height: 30px; padding: 0; flex: none; border: 2px solid var(--paper-3); color: var(--ink); background: var(--paper-2); }
.music-close svg { display: block; width: 12px; height: 12px; }
.music-close:hover { background: #f9dfdf; border-color: var(--blush-deep); }
.music-label { display: block; font-family: var(--font-ui); font-size: 14px; color: var(--ink); margin: 0 0 8px; }
.spotify-frame { width: 100%; height: 152px; border: 0; border-radius: 12px; display: block; color-scheme: normal; }
.music-caption-label { margin-top: 17px; }
.music-caption { width: 100%; box-sizing: border-box; resize: none; border: 0; border-bottom: 2px solid #d6c5b0; padding: 7px 2px; background: transparent; color: var(--dialog-text); font-size: 14px !important; line-height: 1.6; min-height: 66px; border-radius: 0; }
.music-caption:focus { outline: none; border-color: var(--blush-deep); }
.music-caption::placeholder { color: #a48d83; }
.music-search-form { display: flex; gap: 8px; }
.music-search-input { flex: 1; width: 0; min-width: 0; padding: 10px 11px; border: 2px solid var(--paper-3); border-radius: 0; color: var(--dialog-text); background: #fff; font-size: 14px !important; }
.music-search-input:focus { outline: none; border-color: var(--blush-deep); }
.music-button { padding: 9px 14px; border: 2px solid var(--ink); box-shadow: 0 3px 0 var(--wood-dark); background: var(--paper-2); font-family: var(--font-ui) !important; font-size: 16px !important; line-height: 1.1; color: var(--ink-deep); }
.music-button:hover { background: #fff; transform: translateY(-1px); }
.music-button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--wood-dark); }
.music-button:disabled { opacity: .55; cursor: wait; transform: none; }
.music-button.primary { background: #dcebc6; border-color: var(--sage-deep); box-shadow: 0 3px 0 #96b679; }
.music-search-status { min-height: 20px; margin: 16px 0 8px; font-size: 12px; line-height: 1.5; color: #8a6a5c; }
.music-search-status.error { color: #a24950; }
.music-results { max-height: 230px; overflow-y: auto; padding: 0 5px 0 0; scrollbar-color: var(--paper-3) transparent; }
.music-selection { display: grid; gap: 4px; margin-top: 16px; padding: 10px 12px; border-left: 3px solid var(--sage-deep); background: #eff5e7; }
.music-selection[hidden], .music-results[hidden] { display: none; }
.music-selection .music-label { margin: 0; font-size: 12px; color: var(--sage-deep); }
.music-selection b { font-size: 14px; font-weight: 400; overflow-wrap: anywhere; }
.music-selection > span:last-child { font-size: 12px; color: #8a6a5c; overflow-wrap: anywhere; }
.music-result { display: flex; align-items: center; width: 100%; gap: 11px; text-align: left; padding: 9px; margin-bottom: 7px; box-sizing: border-box; border: 2px solid var(--paper-3); background: #fff; color: var(--dialog-text); }
.music-result:hover { border-color: var(--blush-deep); background: #fff5f7; }
.music-result[aria-pressed='true'] { border-color: var(--sage-deep); background: #eff5e7; }
.music-art { width: 42px; height: 42px; object-fit: contain; flex: none; image-rendering: auto; background: var(--paper-2); }
.music-result-copy { min-width: 0; flex: 1; }
.music-result-copy b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 400; }
.music-result-copy span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 4px; font-size: 12px; color: #8a6a5c; }
.music-result-action { font-family: var(--font-ui); font-size: 15px; color: var(--sage-deep); flex: none; }
.music-footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; border-top: 2px solid var(--paper-3); margin-top: 22px; padding-top: 17px; }
.music-credit { font-size: 11px; color: #8a6a5c; line-height: 1.7; }
.music-credit a { color: inherit; text-underline-offset: 3px; }
.music-footer-actions { display: flex; gap: 9px; align-items: center; }
.music-player-window { width: min(430px, 100%); }
.music-player-window .music-heading { margin-bottom: 18px; }
.music-player-window .music-heading h2 { font-size: 26px; }
.music-player-window .music-heading p { margin-top: 8px; }
.music-player-caption { font-size: 15px; line-height: 1.7; color: #8a6a5c; white-space: pre-wrap; overflow-wrap: anywhere; }
@media (max-width: 760px) {

/* ---------- typewriter dialogue ---------- */
function typer(txtEl) {
  let timer = null, current = '';
  return function say(text) {
    if (text === current) return;
    current = text; clearInterval(timer);
    if (reduce) { txtEl.textContent = text; return; }
    let i = 0; txtEl.textContent = '';
    timer = setInterval(() => { i += 2; txtEl.textContent = text.slice(0, i); if (i >= text.length) clearInterval(timer); }, 22);
  };
}

let noteLayer = null;
function openNote(p) {
  noteLayer = el('div', { id: 'noteLayer', className: 'abs' });

  [`your ${pick[3]} is so cute!!`, `${p.facts[2][1].split(', ')[1] || 'doe'} study session sometime?`, `${p.facts[1][1]} sometime?`].forEach(t => {

    starters.append(s);
  });
  const paper = el('form', { id: 'paper', className: 'abs' }, [
    el('h2', { textContent: 'Draft note' }),
    el('div', { className: 'to', textContent: `to: ${p.name}  ·  they'll see it in their mailbox` }),
    ta, starters, count
  ]);
  paper.addEventListener('submit', e => { e.preventDefault(); send(); });
  const btns = el('div', { id: 'noteBtns', className: 'abs' });
  const likeGhost = sbtn(state.liked.has(p.id) ? 'icon_heart_full' : 'icon_heart_empty', 13, 12, 'like', 'dimmed');
  const exit = sbtn(null, 0, 0, 'exit', 'tall');
  const sendB = sbtn('icon_mail', 14, 11, 'send', '');
  exit.addEventListener('click', () => closeNote());
  sendB.addEventListener('click', send);
  btns.append(likeGhost, exit, sendB);
  noteLayer.append(dim, paper, btns);
  $('#stage').append(noteLayer);
  ta.focus();

  function send() {
    const text = ta.value.trim();
    if (!text) { paper.classList.remove('shake'); void paper.offsetWidth; paper.classList.add('shake'); ta.placeholder = 'write something first! even a "hi" works ✿'; ta.focus(); return; }

    playSent(p, text);
  }
}

function playSent(p, text) {
  const layer = el('div', { id: 'sentLayer', className: 'abs' }, [el('div', { className: 'abs ndim' })]);
  const env = el('div', { id: 'env', className: 'abs' });
  const open = img('envelope_open', 120, 80); const closed = img('envelope_closed', 120, 80);
  closed.style.opacity = 0;
  const letter = el('div', { id: 'letter' });
  env.append(open, letter, closed);
  const txt = el('div', { id: 'sentTxt', className: 'abs', textContent: 'SENT!' }); txt.style.opacity = 0;
  layer.append(env, txt); $('#stage').append(layer);
  const T = reduce ? 0 : 1;
  const an = (node, frames, opts) => node.animate(frames, Object.assign({ fill: 'forwards', easing: 'ease-in-out' }, opts, { duration: (opts.duration || 300) * T || 1 }));
  an(env, [{ transform: 'scale(.8)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: 220 });
  an(letter, [{ transform: 'translateY(-10px)' }, { transform: 'translateY(40px)' }], { duration: 450, delay: 250 * T });
  setTimeout(() => { letter.style.visibility = 'hidden'; open.style.opacity = 0; closed.style.opacity = 1;
    an(txt, [{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: 200 });
  }, 720 * T);
  setTimeout(() => an(env, [{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: 'translate(130px,-120px) scale(.2)', opacity: 0 }], { duration: 500, easing: 'ease-in' }), 1300 * T);
  setTimeout(() => {
    layer.remove();
    state.sentTo.add(p.id); state.sent.unshift({ to: p, text, at: new Date() });
    const nb = $('#noteBtn'); if (nb) { nb.classList.add('sent'); nb.querySelector('span').textContent = 'note sent!'; }
    const tab = $('#lockerTab'); const t = $('#lockerTxt');
    if (tab && t) { tab.textContent = 'Mochi'; t.textContent = `your note is slipped into ${p.name.split(' ')[0]}'s locker! it opens a DM between you two. find it under mailbox → sent.`; }
  }, 1900 * T + 20);
}

function readLockerSong() {
  try {
    const saved = JSON.parse(localStorage.getItem(SONG_STORAGE));
    if (!saved || !/^[A-Za-z0-9]{22}$/.test(saved.id) || typeof saved.title !== 'string' || typeof saved.artist !== 'string') return null;
    return { ...saved, url: `https://open.spotify.com/track/${saved.id}`, caption: typeof saved.caption === 'string' ? saved.caption.slice(0, 120) : '', placement: musicPlacement(saved.placement) };

function musicPlacement(value = {}) {
  return {
    cx: Number.isFinite(value?.cx) ? Math.max(11, Math.min(178, value.cx)) : 95,
    cy: Number.isFinite(value?.cy) ? Math.max(11, Math.min(154, value.cy)) : 141,
    scale: value?.scale === 2 ? 2 : 1,
    rot: Number.isFinite(value?.rot) ? value.rot % 360 : 0,
    flip: value?.flip === true,

}

function writeLockerSong(song) {

function openMusicLayer(label, compact = false) {
  if (musicLayer) musicLayer.inert = true;
  const returnFocus = document.activeElement;
  const overlay = el('div', { className: 'music-overlay' });
  const dialog = el('section', { className: 'music-window' + (compact ? ' music-player-window' : ''), tabIndex: -1 });
  dialog.setAttribute('role', 'dialog');

  overlay.append(dialog);
  overlay.addEventListener('click', event => { if (event.target === overlay) closeMusicEditor(); });
  overlay.addEventListener('keydown', event => {
    if (event.key === 'Escape') { event.preventDefault(); event.stopPropagation(); closeMusicEditor(); }
    if (event.key !== 'Tab') return;
    const focusable = [...dialog.querySelectorAll('button:not(:disabled), input, textarea, a, iframe')].filter(node => !node.hidden);
    const first = focusable[0], last = focusable[focusable.length - 1];
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
  });
  musicLayer = overlay;
  musicLayers.push({ layer: overlay, returnFocus });

function closeMusicEditor() {
  const entry = musicLayers.pop();

  entry.layer.remove();
  musicLayer = musicLayers.at(-1)?.layer || null;

function fit() {
  const cs = getComputedStyle(document.body);
  const aw = document.body.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = document.body.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - ($('#narrow').offsetHeight || 0);
  let s = Math.min(aw / 480, ah / 270);
  if (s > 1) s = Math.floor(s * 4) / 4;
  $('#stage').style.transform = `scale(${s})`;
  $('#fit').style.width = 480 * s + 'px'; $('#fit').style.height = 270 * s + 'px';
}

async function startItems() {

  });

const bakedFrom = {};

async function srcCanvas(it) {
  // the item's un-transformed pixels
  if (it.upload) {
    if (it.kind === 'photo') return framePhoto(it.upload, PHOTO_SIZES[it.size || 0]);
    return it.upload; // sticker canvas
  }
  const im = await asset(it.base); const [w, h] = sz(it.base);
  const [c, x] = canvas(w, h); x.drawImage(im, 0, 0); return c;
}
async function bake(it) {
  const src = await srcCanvas(it);
  const s = it.upload && it.kind === 'photo' ? 1 : it.scale;
  const w = src.width * s, h = src.height * s, r = it.rot * Math.PI / 180;
  const W = Math.ceil(Math.abs(w * Math.cos(r)) + Math.abs(h * Math.sin(r))), H = Math.ceil(Math.abs(w * Math.sin(r)) + Math.abs(h * Math.cos(r)));
  const [c, x] = canvas(W, H);
  x.translate(W / 2, H / 2); x.rotate(r); x.scale(it.flip ? -1 : 1, 1);
  x.drawImage(src, -w / 2, -h / 2, w, h);
  const k = 'ux_' + it.id + '_' + (++uid);
  A[k] = c.toDataURL(); SIZES[k] = [W, H]; it.key = k; it.W = W; it.H = H;
  bakedFrom[k] = Object.assign({}, it);
  return it;
}

// photo upload → pixel polaroid, drawn the same way as polaroid() in assets.py
function pixelate(image, pw, ph) {
  const iw = image.naturalWidth || image.width, ih = image.naturalHeight || image.height;
  const s = Math.max(pw / iw, ph / ih); const sw = pw / s, sh = ph / s;
  const [m, mx] = canvas(pw * 4, ph * 4); mx.imageSmoothingEnabled = true; mx.imageSmoothingQuality = 'high';
  mx.drawImage(image, (iw - sw) / 2, (ih - sh) / 2, sw, sh, 0, 0, pw * 4, ph * 4);
  const [c, x] = canvas(pw, ph); x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high'; x.drawImage(m, 0, 0, pw, ph);
  const d = x.getImageData(0, 0, pw, ph); for (let i = 0; i < d.data.length; i += 4) for (let j = 0; j < 3; j++) d.data[i + j] = Math.min(255, Math.round(d.data[i + j] / 20) * 20 + 6);
  x.putImageData(d, 0, 0); return c;
}
function framePhoto(image, [W, H, pw, ph]) {
  const [c, x] = canvas(W, H);
  const r = (x0, y0, x1, y1, col) => { x.fillStyle = col; x.fillRect(x0, y0, x1 - x0 + 1, y1 - y0 + 1); };
  r(0, 1, W - 1, H - 1, '#6e4a3c'); r(1, 2, W - 2, H - 2, '#fffaf0'); r(1, H - 2, W - 2, H - 2, '#f3e6cf'); r(W - 2, 2, W - 2, H - 2, '#f3e6cf');
  x.drawImage(pixelate(image, pw, ph), 2, 3); r(2, 3 + ph, W - 3, 3 + ph, '#e2cfae');
  const t0 = Math.round(W / 2) - 4; for (let i = 0; i < 8; i++) { r(t0 + i, 0, t0 + i, 2, '#f4b8c7'); if (i % 2) r(t0 + i, 1, t0 + i, 1, '#fbd9e1'); }
  return c;
}
function stickerize(image) {
  const iw = image.naturalWidth || image.width, ih = image.naturalHeight || image.height;
  const s = 18 / Math.max(iw, ih); const w = Math.max(4, Math.round(iw * s)), h = Math.max(4, Math.round(ih * s));
  const [m, mx] = canvas(w, h); mx.imageSmoothingEnabled = true; mx.imageSmoothingQuality = 'high'; mx.drawImage(image, 0, 0, w, h);
  const d = mx.getImageData(0, 0, w, h);
  const opaque = [...Array(w * h).keys()].every(i => d.data[i * 4 + 3] > 200);
  const inside = (px, py) => px >= 0 && py >= 0 && px < w && py < h && (opaque ? !((px === 0 || px === w - 1) && (py === 0 || py === h - 1)) : d.data[(py * w + px) * 4 + 3] > 128);
  const [c, x] = canvas(w + 3, h + 3);
  for (let py = -1; py <= h; py++) for (let px = -1; px <= w; px++) {
    let near = false; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (inside(px + dx, py + dy)) near = true;
    if (near) { x.fillStyle = 'rgba(0,0,0,.16)'; x.fillRect(px + 2, py + 2, 1, 1); }
  }
  for (let py = -1; py <= h; py++) for (let px = -1; px <= w; px++) {
    let near = false; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (inside(px + dx, py + dy)) near = true;
    if (near) { x.fillStyle = '#fff'; x.fillRect(px + 1, py + 1, 1, 1); }
  }
  for (let py = 0; py < h; py++) for (let px = 0; px < w; px++) if (inside(px, py)) {
    const i = (py * w + px) * 4; x.fillStyle = `rgb(${Math.round(d.data[i] / 24) * 24},${Math.round(d.data[i + 1] / 24) * 24},${Math.round(d.data[i + 2] / 24) * 24})`; x.fillRect(px + 1, py + 1, 1, 1);
  }
  return c;
}

  L._next = () => { popLayer(L); openOneNote(list[0]); };
  const side = el('div', { id: 'stackBtns', className: 'abs' }, [
    sbtnF('icon_mail', 14, 11, `unfold (${list.length} new)`, 'tall', () => { popLayer(L); openOneNote(list[0]); }),
    sbtnF(null, 0, 0, 'see all new notes', '', () => { popLayer(L); openAllNotes(); }),
    sbtnF(null, 0, 0, 'open my locker →', 'small', () => { popLayer(L); openLocker(ME); }),
  ]);
  L.append(doorEl, el('div', { id: 'stackHint', className: 'abs mtitle', style: 'top:204px;font-size:9px', textContent: `${list.length} new note${list.length > 1 ? 's' : ''} slipped into your locker ✉  press → to unfold` }), side);
  pushLayer(L);
}
function sbtnF(icon, w, h, label, cls, on) { const b = sbtn(icon, w, h, label, cls); b.addEventListener('click', on); return b; }

function openOneNote(n) {
  markViewed(n);
  const left = unviewed();
  const L = el('div', { id: 'oneLayer', className: 'fl' }, [el('div', { className: 'fl-dim' })]);
  const close = () => { popLayer(L); backToHall(); };
  L._esc = close;
  const paper = el('div', { id: 'oneNote', className: 'abs' }, [
    el('span', { className: 'count2', textContent: left.length ? `${left.length} more new` : 'all caught up ✿' }),
    el('div', { className: 'from' }, [img('avatar_' + n.from.id, 24, 24), el('div', {}, [el('b', { textContent: `note from ${n.from.name}` }), el('span', { textContent: `${n.when} · saved to your DMs` })])]),
    el('div', { className: 'body', textContent: n.text })]);
  const side = el('div', { id: 'stackBtns', className: 'abs' }, [
    sbtnF('icon_mail', 14, 11, 'reply in DMs', 'tall', () => { close(); state.dmWith = n; state.dmOpen = true; mailTab = 'received'; openMail(); }),
    sbtnF(null, 0, 0, 'peek at their locker', '', () => { close(); openLocker(n.from); }),
    left.length ? sbtnF(null, 0, 0, 'next note →', '', () => { popLayer(L); openOneNote(left[0]); }) : sbtnF(null, 0, 0, 'no more new notes', 'dimmed', () => {}),
    left.length ? sbtnF(null, 0, 0, 'see all new notes', 'small', () => { popLayer(L); openAllNotes(); }) : sbtnF(null, 0, 0, 'open DMs', 'small', () => { close(); state.dmOpen = false; mailTab = 'received'; openMail(); }),
    sbtnF(null, 0, 0, '← hallway', 'small', close),
  ]);
  if (left.length) L._next = () => { popLayer(L); openOneNote(left[0]); };
  L.append(paper, side); pushLayer(L);
}
function openAllNotes() {
  const L = el('div', { id: 'allLayer', className: 'fl' }, [el('div', { className: 'fl-dim' })]);
  const close = () => { popLayer(L); backToHall(); };
  L._esc = close;
  const list = unviewed();
  const g = el('div', { id: 'allNotes' });
  for (let i = 0; i < 9; i++) {
    const n = list[i];
    if (!n) { g.append(el('div', { className: 'ncard empty2' })); continue; }
    const c = el('button', { className: 'ncard unread', type: 'button' }, [
      el('div', { className: 'h' }, [img('avatar_' + n.from.id, 24, 24, { style: 'width:12px;height:12px' }), el('span', { textContent: 'note from ' + n.from.name.split(' ')[0] })]),
      el('p', { textContent: 'tap to unfold ✉' }), el('span', { className: 'chip', textContent: 'open', style: 'align-self:flex-start;font-size:5.5px;padding:1px 4px' })]);
    c.style.animationDelay = i * 30 + 'ms';
    c.addEventListener('click', () => { popLayer(L); openOneNote(n); });
    g.append(c);
  }
  const dmBtn = btn('viewed notes live in your DMs →', 'chip', () => { close(); state.dmOpen = false; mailTab = 'received'; openMail(); });
  L.append(el('div', { className: 'mtitle', textContent: list.length ? `new notes (${list.length})` : 'all caught up ✿' }), g,
    el('div', { className: 'mclose' }, [btn('close', 'chip', close)]), el('div', { className: 'abs', style: 'left:0;right:0;top:243px;text-align:center' }, [dmBtn]));
  pushLayer(L);
}

addEventListener('keydown', e => { const top = layers[layers.length - 1]; if (e.key === 'ArrowRight' && top && top._next && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) top._next(); });

/* ================================================================
   boot
   ================================================================ */
applySprite();
renderGrid(); updateBadges();
if (location.hash === '#hallway') {
  // skip onboarding: jump straight to the hallway with the example profile
  Object.assign(profile, EXAMPLE);
  startItems().then(() => { profile.live = true; syncMe(); renderGrid(); updateBadges(); setTimeout(openQuiz, 600); });
} else openLogin();
</script>

</body>
</html>
